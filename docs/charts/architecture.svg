<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3d3d3d"/>
    </marker>
    <marker id="arwBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a78d6"/>
    </marker>
  </defs>

  <rect width="900" height="520" fill="#ffffff"/>

  <!-- ================= column headings ================= -->
  <text x="150" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">ISSUING (university)</text>
  <text x="450" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">STORAGE</text>
  <text x="760" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">VERIFYING (employer)</text>

  <line x1="300" y1="40" x2="300" y2="470" stroke="#d9dee7" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="610" y1="40" x2="610" y2="470" stroke="#d9dee7" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ================= issuing side ================= -->
  <rect x="35" y="52" width="230" height="46" rx="8" fill="#f1f3f6" stroke="#b9c2d0"/>
  <text x="150" y="72" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0b0b0b">1. Certificate details</text>
  <text x="150" y="89" text-anchor="middle" font-size="11" fill="#52514e">name, course, CGPA, date</text>

  <line x1="150" y1="98" x2="150" y2="128" stroke="#3d3d3d" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="158" y="117" font-size="10.5" fill="#52514e">encrypt (AES-256)</text>

  <rect x="35" y="130" width="230" height="46" rx="8" fill="#f1f3f6" stroke="#b9c2d0"/>
  <text x="150" y="150" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0b0b0b">2. Scrambled file</text>
  <text x="150" y="167" text-anchor="middle" font-size="11" fill="#52514e">unreadable without the key</text>

  <!-- key branch -->
  <line x1="150" y1="176" x2="150" y2="210" stroke="#2a78d6" stroke-width="1.6" marker-end="url(#arwBlue)"/>
  <rect x="35" y="212" width="230" height="46" rx="8" fill="#eaf2fd" stroke="#2a78d6"/>
  <text x="150" y="232" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1c5cab">3. Key → QR code</text>
  <text x="150" y="249" text-anchor="middle" font-size="11" fill="#1c5cab">handed to the student only</text>

  <!-- ================= storage ================= -->
  <rect x="330" y="130" width="250" height="60" rx="8" fill="#f1f3f6" stroke="#b9c2d0"/>
  <text x="455" y="153" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0b0b0b">IPFS (file storage)</text>
  <text x="455" y="171" text-anchor="middle" font-size="11" fill="#52514e">holds the scrambled file</text>
  <text x="455" y="185" text-anchor="middle" font-size="11" fill="#52514e">returns an address (CID)</text>

  <line x1="265" y1="153" x2="326" y2="153" stroke="#3d3d3d" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="296" y="145" text-anchor="middle" font-size="10.5" fill="#52514e">upload</text>

  <rect x="330" y="300" width="250" height="76" rx="8" fill="#eaf2fd" stroke="#2a78d6" stroke-width="1.6"/>
  <text x="455" y="323" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1c5cab">Blockchain (Polygon)</text>
  <text x="455" y="341" text-anchor="middle" font-size="11" fill="#1c5cab">stores only two small things:</text>
  <text x="455" y="356" text-anchor="middle" font-size="11" fill="#1c5cab">• the IPFS address</text>
  <text x="455" y="370" text-anchor="middle" font-size="11" fill="#1c5cab">• a fingerprint of the file</text>

  <line x1="455" y1="190" x2="455" y2="296" stroke="#3d3d3d" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="447" y="243" text-anchor="end" font-size="10.5" fill="#52514e">record address</text>
  <text x="447" y="257" text-anchor="end" font-size="10.5" fill="#52514e">+ fingerprint</text>

  <text x="455" y="404" text-anchor="middle" font-size="11" font-style="italic" fill="#52514e">No personal data is ever written here.</text>

  <!-- ================= verifying side ================= -->
  <rect x="645" y="52" width="230" height="46" rx="8" fill="#f1f3f6" stroke="#b9c2d0"/>
  <text x="760" y="72" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0b0b0b">4. Scan the QR code</text>
  <text x="760" y="89" text-anchor="middle" font-size="11" fill="#52514e">no account, no wallet needed</text>

  <line x1="265" y1="235" x2="700" y2="235" stroke="#2a78d6" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arwBlue)"/>
  <text x="640" y="228" text-anchor="middle" font-size="10.5" fill="#1c5cab">student shows the QR code</text>

  <line x1="760" y1="98" x2="760" y2="128" stroke="#3d3d3d" stroke-width="1.6" marker-end="url(#arw)"/>

  <rect x="645" y="130" width="230" height="60" rx="8" fill="#f1f3f6" stroke="#b9c2d0"/>
  <text x="760" y="153" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0b0b0b">5. Download the file</text>
  <text x="760" y="171" text-anchor="middle" font-size="11" fill="#52514e">and calculate its own</text>
  <text x="760" y="185" text-anchor="middle" font-size="11" fill="#52514e">fingerprint</text>

  <line x1="584" y1="160" x2="641" y2="160" stroke="#3d3d3d" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="612" y="152" text-anchor="middle" font-size="10.5" fill="#52514e">fetch</text>

  <rect x="645" y="300" width="230" height="76" rx="8" fill="#eaf2fd" stroke="#2a78d6" stroke-width="1.6"/>
  <text x="760" y="323" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1c5cab">6. Compare fingerprints</text>
  <text x="760" y="341" text-anchor="middle" font-size="11" fill="#1c5cab">same → genuine</text>
  <text x="760" y="356" text-anchor="middle" font-size="11" fill="#1c5cab">different → file was edited</text>
  <text x="760" y="370" text-anchor="middle" font-size="11" fill="#1c5cab">marked revoked → withdrawn</text>

  <line x1="760" y1="190" x2="760" y2="296" stroke="#3d3d3d" stroke-width="1.6" marker-end="url(#arw)"/>

  <line x1="584" y1="338" x2="641" y2="338" stroke="#3d3d3d" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="612" y="330" text-anchor="middle" font-size="10.5" fill="#52514e">read</text>

  <!-- ================= footer note ================= -->
  <rect x="35" y="430" width="840" height="60" rx="8" fill="#fbfbf9" stroke="#d9dee7"/>
  <text x="52" y="452" font-size="11.5" font-weight="600" fill="#0b0b0b">Why this works</text>
  <text x="52" y="470" font-size="11" fill="#52514e">Steps 5 and 6 need no key, so anyone can confirm a certificate is genuine without being able to read it.</text>
  <text x="52" y="484" font-size="11" fill="#52514e">Changing even one character of the stored file changes its fingerprint, and the blockchain record cannot be altered.</text>
</svg>
